<robot_prefix>ouster/os_driver:
  ros__parameters:
  # https://github.com/ouster-lidar/ouster-ros/blob/jazzy-devel/ouster-ros/config/driver_params.yaml
    sensor_hostname: '192.168.131.20'
    udp_dest: '192.168.131.1'
    mtp_dest: ''
    mtp_main: false
    lidar_mode: ''
    timestamp_mode: 'TIME_FROM_ROS_TIME'
    ptp_utc_tai_offset: -37.0
    udp_profile_lidar: ''
    metadata: ''
    lidar_port: 7502
    imu_port: 7503
    sensor_frame: os_sensor
    lidar_frame: os_lidar
    imu_frame: os_imu
    point_cloud_frame: os_lidar
    pub_static_tf: false
    proc_mask: IMU|PCL|SCAN|IMG|RAW|TLM
    scan_ring: 0
    use_system_default_qos: false
    point_type: original
    azimuth_window_start: 0
    azimuth_window_end: 360000
    persist_config: false
    attempt_reconnect: false
    dormant_period_between_reconnects: 1.0
    max_failed_reconnect_attempts: 2147483647
    organized: true
    destagger: true
    min_range: 0.0
    max_range: 1000.0
    v_reduction: 1
    min_scan_valid_columns_ratio: 0.0
    mask_path: ''

# Attached to Jackal
<robot_prefix>camera_0/camera_0_node:
  ros__parameters:
  # https://github.com/realsenseai/realsense-ros/blob/ros2-master/realsense2_camera/launch/rs_launch.py
    camera_name: camera_0
    _device_type: d435
    _usb_port_id: 2-3
    serial_no: _246422071411
    base_frame_id: link

    camera_0_node.aligned_depth_to_color.image_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    camera_0_node.color.image_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    camera_0_node.depth.image_rect_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    rgb_camera.color_profile: '640x480x30' # 640x480x30, 1280x720x30
    depth_module.depth_profile: '640x480x30'

    enable_color: true
    enable_depth: true
    enable_rgbd: true
    enable_sync: true
    align_depth.enable: true
    align_depth.frames_queue_size: 16

    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_accel: false
    enable_gyro: false
    pointcloud.enable: true
    publish_tf: true

# Attached to the arm (end-effector)
<robot_prefix>arm_camera_1/camera_1_node:
  ros__parameters:
    camera_name: camera_1
    _device_type: d435i
    _usb_port_id: 1-4
    serial_no: '_233522071012'
    base_frame_id: link

    camera_1_node.aligned_depth_to_color.image_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    camera_1_node.color.image_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    camera_1_node.depth.image_rect_raw.enable_pub_plugins:
      - image_transport/compressedDepth
      - image_transport/compressed
      - image_transport/raw
      # - image_transport/ffmpeg
      # - image_transport/theora
      # - image_transport/zstd
    rgb_camera.color_profile: '640x480x15'
    depth_module.depth_profile: '640x480x15'

    enable_color: true
    enable_depth: true
    enable_rgbd: true
    enable_sync: true
    align_depth.enable: true
    align_depth.frames_queue_size: 16

    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_accel: false
    enable_gyro: false
    pointcloud.enable: true
    publish_tf: true